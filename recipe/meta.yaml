{% set name = "cyvlfeat" %}
{% set version = "0.8.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: bc4311b00c7217a45158baed653f31886dbf8f7c72966a92e5e1b80766b89152

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [py<310]

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - python                                 # [build_platform != target_platform]
    - cython >=3.0                           # [build_platform != target_platform]
    - numpy                                  # [build_platform != target_platform]
    - setuptools >=77                        # [build_platform != target_platform]
    - setuptools-scm >=8                     # [build_platform != target_platform]
  host:
    - python
    - pip
    - setuptools >=77
    - setuptools-scm >=8
    - cython >=3.0
    - numpy
  run:
    - python
    - numpy >=1.23
    - scipy >=1.6

# VLFeat is bundled (compiled into a static library that every extension links), so there is no
# vlfeat dependency any more.

test:
  imports:
    - cyvlfeat
    - cyvlfeat.sift.sift
    - cyvlfeat.sift.dsift
    - cyvlfeat.sift.phow
    - cyvlfeat.fisher.fisher
    - cyvlfeat.gmm.gmm
    - cyvlfeat.hog.hog
    - cyvlfeat.kmeans.kmeans
    - cyvlfeat.quickshift.quickshift
    - cyvlfeat.vlad.vlad
    - cyvlfeat.generic.generic
  requires:
    - pip
  commands:
    - pip check

about:
  home: https://github.com/menpo/cyvlfeat
  dev_url: https://github.com/menpo/cyvlfeat
  license: BSD-2-Clause
  license_family: BSD
  license_file:
    - LICENSE.txt
    - VLFEAT-LICENSE
  summary: A Python (cython) wrapper of the VLFeat library

extra:
  recipe-maintainers:
    - patricksnape
